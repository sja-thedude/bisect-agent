[project]
name = "bisect-agent"
version = "0.1.0"
description = "Autonomous regression-hunting agent: writes a repro test, drives git bisect in a Docker sandbox, explains the culprit commit."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bisect-agent = "bisect_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bisect_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon", "network: needs internet access"]
